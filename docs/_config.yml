# GitHub Pages configuration for the freeesp32_ave documentation site.
#
# There is no build step and no templating. Every page is hand-written static
# HTML with no YAML front matter, which Jekyll copies through byte for byte, so
# this file exists only to make sure Jekyll adds nothing: no theme, no plugins,
# no layouts, no generated index.
#
# Keep it that way. If a page ever needs front matter or a layout, it has
# stopped being a file you can open from a local checkout with the network
# unplugged, which is the one property this site is built around.
#
# ---------------------------------------------------------------------------
# PUBLISHING SOURCE
#
# Every link in the site is RELATIVE (../assets/site.css, sessions/index.html),
# so the site works unchanged whether Pages is served from "/docs" on the
# default branch — which is the current setting — or from "/ (root)", in which
# case this file must be copied to the repository root to take effect.
#
# An earlier revision of this comment claimed the pages used root-absolute
# /docs/... hrefs and therefore required a root publishing source. That has not
# been true for a long time, and acting on it would have broken a working site.
# If you change the link style, change this paragraph in the same commit.
# ---------------------------------------------------------------------------

title: ESP32 AVE
description: Open-source audio-visual entrainment firmware for the ESP32

# No theme, no plugins: nothing to resolve, nothing to install, nothing to break.
theme:
plugins: []

# Do not let Jekyll turn the maintainer note into a page.
exclude:
  - README.md

# Directories whose names start with an underscore are skipped by default;
# nothing here uses them, but be explicit so a future assets/_* folder ships.
include:
  - assets

# Absolute links in the pages are written against the repository layout, so
# Jekyll must not prepend anything to them.
baseurl: ""
